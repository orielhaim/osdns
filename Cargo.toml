[package]
name = "osdns"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Transactional, ownership-safe management of host operating-system DNS configuration"
license = "MIT OR Apache-2.0"
repository = "https://github.com/orielhaim/osdns"
homepage = "https://github.com/orielhaim/osdns"
documentation = "https://docs.rs/osdns"
readme = "README.md"
keywords = ["dns", "network", "system", "configuration"]
categories = ["network-programming", "os"]

[features]
default = []
# Emit `tracing` events for transactions, recovery, and reconciliation.
tracing = ["dep:tracing"]
# In-memory backend and fault-injection utilities for testing. Not for production builds.
test-util = []

[dependencies]
atomic-write-file = "0.3"
idna = "1"
resolv-conf = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = { version = "0.1", optional = true }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
inotify = "0.11"
zbus = "5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_Dns",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }
windows-registry = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
system-configuration = "0.8.0"

[dev-dependencies]
criterion = "0.8.2"
osdns = { path = ".", features = ["test-util"] }
rstest = "0.26.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[bench]]
name = "engine"
harness = false
required-features = ["test-util"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
