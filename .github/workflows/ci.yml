name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTFLAGS: -D warnings
  RUSTUP_TOOLCHAIN: "1.98.1"

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all --check

      - name: Validate lockfile
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Windows bindings drift
        run: |
          cargo run --manifest-path tools/win32-bindings/Cargo.toml
          cargo run --manifest-path tools/win32-bindings/Cargo.toml
          git diff --exit-code -- src/platform/windows/ffi/bindings.rs

  verify:
    name: Verify / ${{ matrix.os }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}
          cache-on-failure: true

      - name: Clippy / default
        run: cargo clippy --locked --all-targets --no-deps -- -D warnings

      - name: Clippy / all features
        run: cargo clippy --locked --all-targets --all-features --no-deps -- -D warnings

      - name: Clippy / test-util
        run: cargo clippy --locked --all-targets --features test-util --no-deps -- -D warnings

      - name: Clippy / tracing
        run: cargo clippy --locked --all-targets --features tracing --no-deps -- -D warnings

      - name: Test / default
        run: cargo test --locked

      - name: Test / all features
        run: cargo test --locked --all-features

      - name: Integration / systemd-resolved
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail

          sudo ip link add osdns-ci type dummy
          trap 'sudo ip link delete osdns-ci' EXIT

          sudo ip link set osdns-ci up

          sudo env \
            PATH="$PATH" \
            RUSTFLAGS="$RUSTFLAGS" \
            RUSTUP_HOME="$HOME/.rustup" \
            CARGO_HOME="$HOME/.cargo" \
            RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN" \
            OSDNS_ALLOW_SYSTEM_MUTATION=1 \
            OSDNS_TEST_INTERFACE=osdns-ci \
            cargo test \
              --locked \
              --all-features \
              --test backend_matrix \
              matrix_systemd_resolved_lifecycle \
              -- \
              --exact \
              --nocapture

      - name: Integration / Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: ./.github/scripts/windows-integration.ps1

      - name: Integration / macOS
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          sudo env \
            PATH="$PATH" \
            RUSTFLAGS="$RUSTFLAGS" \
            RUSTUP_HOME="$HOME/.rustup" \
            CARGO_HOME="$HOME/.cargo" \
            RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN" \
            OSDNS_ALLOW_SYSTEM_MUTATION=1 \
            cargo test \
              --locked \
              --all-features \
              --test backend_matrix \
              --test macos \
              -- \
              --nocapture \
              --test-threads=1

      - name: Prepare cross-check / Linux
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          rustup target add aarch64-apple-darwin
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm

      - name: Cross-check / Linux -> macOS ARM64
        if: ${{ runner.os == 'Linux' }}
        run: cargo check --locked --target aarch64-apple-darwin --all-targets --all-features
        env:
          CC: clang
          AR: llvm-ar
          CFLAGS: -ffreestanding

      - name: Prepare cross-check / Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          rustup target add aarch64-apple-darwin x86_64-unknown-linux-gnu

      - name: Cross-check / Windows -> macOS ARM64
        if: ${{ runner.os == 'Windows' }}
        run: cargo check --locked --target aarch64-apple-darwin --all-targets --all-features
        env:
          CC: clang
          AR: llvm-ar
          CFLAGS: -ffreestanding

      - name: Cross-check / Windows -> Linux x86_64
        if: ${{ runner.os == 'Windows' }}
        run: cargo check --locked --target x86_64-unknown-linux-gnu --all-targets --all-features
        env:
          CC: clang
          AR: llvm-ar
          CFLAGS: -ffreestanding

      - name: Windows arch compile-check
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          rustup target add aarch64-pc-windows-msvc i686-pc-windows-msvc
          cargo check --locked --target aarch64-pc-windows-msvc --all-features
          cargo check --locked --target i686-pc-windows-msvc --all-features

      - name: Windows dependency graph assertions
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $tree = cargo tree --locked --edges normal 2>&1 | Out-String
          if ($tree -match 'windows v0\.62') { throw 'windows 0.62 still present' }
          if ($tree -match 'windows-sys v0\.61') { throw 'windows-sys 0.61 still present in production graph' }
          if ($tree -match 'windows-registry v0\.[0-9]\.') { throw 'old windows-registry still present' }
          if ($tree -match '(^|\s)tokio v') { throw 'tokio must not appear' }
          if ($tree -match 'rtnetlink') { throw 'rtnetlink must not appear on Windows' }
          if ($tree -notmatch 'windows-registry v0\.100') { throw 'windows-registry 0.100 missing' }
          if ($tree -notmatch 'windows-link v0\.100') { throw 'windows-link 0.100 missing' }
          Write-Host 'dependency assertions ok'
  release-checks:
    name: Release checks
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-Linux
          cache-on-failure: true

      - uses: taiki-e/install-action@v2.87.7
        with:
          tool: |
            cargo-hack
            cargo-deny
            cargo-semver-checks
          fallback: none

      - name: Dependency policy and advisories
        run: cargo deny check

      - name: SemVer
        run: cargo semver-checks check-release --manifest-path Cargo.toml

      - name: Feature powerset
        run: cargo hack check --each-feature --no-dev-deps --offline

      - name: Documentation
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - uses: dtolnay/rust-toolchain@1.95.0

      - name: MSRV
        run: cargo +1.95.0 check --locked --all-features --all-targets

      - name: Package / publish dry-run
        run: cargo publish --dry-run --locked

      - name: Compile benchmarks
        run: cargo bench --locked --features test-util --no-run

  openresolv:
    name: Openresolv integration
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    container: debian:trixie

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            build-essential \
            git \
            openresolv

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@v2.87.7
        with:
          tool: rust@1.98.1
          fallback: none

      - name: Configure openresolv
        run: |
          echo 'resolv_conf=/tmp/osdns-resolv.conf' >> /etc/resolvconf.conf
          resolvconf -u

      - name: Integration / openresolv
        run: |
          cargo test \
            --locked \
            --all-features \
            --test backend_matrix \
            matrix_resolvconf_lifecycle \
            -- \
            --exact \
            --nocapture
        env:
          OSDNS_ALLOW_SYSTEM_MUTATION: "1"
